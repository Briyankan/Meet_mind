{% extends "base.html" %}
{% block title %}Log In — MeetMind AI{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<div class="container-page auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to access your saved summaries.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" name="email" class="form-control auth-input" required autofocus>

      <label class="form-label mt-3" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control auth-input" required>

      <button type="submit" class="btn btn-submit w-100 mt-4">Log In</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{{ url_for('register_page') }}">Sign up</a></p>
  </div>
</div>
{% endblock %}
