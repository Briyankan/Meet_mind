{% extends "base.html" %}
{% block title %}Sign Up — MeetMind AI{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<div class="container-page auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Save your meeting summaries and access them anytime.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" name="email" class="form-control auth-input" required autofocus>

      <label class="form-label mt-3" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control auth-input" minlength="8" required>
      <span class="auth-hint">At least 8 characters.</span>

      <label class="form-label mt-3" for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control auth-input" minlength="8" required>

      <button type="submit" class="btn btn-submit w-100 mt-4">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
